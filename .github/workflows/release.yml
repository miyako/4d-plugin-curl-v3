# Build the measured source-backed plugin without secrets first; only then use
# the existing Developer ID/notarization and guarded publication path.
name: Build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PRODUCT_NAME: cURL

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - id: set
        name: Validate source version and publication before native work
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 .github/scripts/release_version.py preflight --sha "$GITHUB_SHA" --ref "$GITHUB_REF"

  source-native:
    needs: version
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/native-trace.yml
    with:
      native-candidate-plugin-only: true
      native-candidate-inventory-run: '43302769645'
      native-materials-provider-run: '43330282753'

  build-macos:
    name: Bind source materials, sign, notarize and package
    needs: [version, source-native]
    runs-on: macos-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: unsigned-native-*
          path: release-inputs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: isolated-selected-plugin-delivery-*
          path: release-inputs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: '43330282753'
          github-token: ${{ github.token }}
          pattern: isolated-provider-materials-*
          path: provider-inputs
      - name: Verify and assemble corresponding sources, relink objects and notices
        run: |
          set -euo pipefail
          python .github/scripts/release_materials.py prepare \
            --inputs "$PWD/release-inputs" --providers "$PWD/provider-inputs" \
            --output "$RUNNER_TEMP/release-materials"
          BUNDLE="$PWD/release-inputs/unsigned-native-build-macOS/test/Plugins/cURL.bundle"
          cp "$BUNDLE/Contents/MacOS/cURL" "$RUNNER_TEMP/unsigned-cURL"
          echo "BUNDLE_PATH=$BUNDLE" >> "$GITHUB_ENV"

      - name: import Developer ID certificate
        env:
          CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo -n "$CERT_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
      - name: store notarytool credentials
        env:
          APPLE_ID: ${{ secrets.NOTARYTOOL_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.NOTARYTOOL_PASSWORD }}
        run: |
          xcrun notarytool store-credentials "notarytool-profile" \
            --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_PASSWORD" \
            --keychain "$KEYCHAIN_PATH"
      - name: codesign
        run: |
          set -euo pipefail
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)".*/\1/')
          codesign --verbose --deep --timestamp --force --options=runtime \
            --sign "$IDENTITY" "$BUNDLE_PATH"
          codesign --verify --deep --strict --verbose=2 "$BUNDLE_PATH"
          python .github/scripts/release_materials.py rebind \
            --unsigned "$RUNNER_TEMP/unsigned-cURL" --signed "$BUNDLE_PATH/Contents/MacOS/cURL" \
            --evidence release-inputs/unsigned-native-build-macOS/native-trace/build-evidence.json \
            --output "$RUNNER_TEMP/signed-build-evidence.json"
      - name: package, notarize and staple
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          ZIP_PATH="${PRODUCT_NAME}-${RELEASE_VERSION}.zip"
          DMG_PATH="${PRODUCT_NAME}-${RELEASE_VERSION}.dmg"
          ditto -c -k --keepParent "$BUNDLE_PATH" "$ZIP_PATH"
          hdiutil create -format UDBZ -volname "$PRODUCT_NAME" -srcfolder "$BUNDLE_PATH" "$DMG_PATH"
          xcrun notarytool submit "$ZIP_PATH" --keychain-profile "notarytool-profile" --keychain "$KEYCHAIN_PATH" --wait
          xcrun notarytool submit "$DMG_PATH" --keychain-profile "notarytool-profile" --keychain "$KEYCHAIN_PATH" --wait
          xcrun stapler staple "$DMG_PATH"
          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"
      - name: generate and validate final SBOMs and complete release source delivery
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          python -m pip install -q -r build/sbom/requirements.txt
          python build/sbom/generate.py generate --version "$RELEASE_VERSION" --output sbom \
            --evidence "$RUNNER_TEMP/signed-build-evidence.json" \
            --evidence release-inputs/unsigned-native-build-Windows/native-trace/build-evidence.json \
            "$ZIP_PATH" "$DMG_PATH"
          python build/sbom/validate.py --version "$RELEASE_VERSION" --output sbom \
            --schema-dir "$RUNNER_TEMP/sbom-schemas" "$ZIP_PATH" "$DMG_PATH"
          python .github/scripts/release_materials.py finalize \
            --source "$RUNNER_TEMP/release-materials/release/corresponding-source" \
            --output "${PRODUCT_NAME}-${RELEASE_VERSION}-sources.zip" --version "$RELEASE_VERSION" \
            "sbom/${ZIP_PATH}.inventory.json" "sbom/${DMG_PATH}.inventory.json"
      - name: Retain final containers, sidecars and corresponding source delivery
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: finalized-release
          path: |
            ${{ env.ZIP_PATH }}
            ${{ env.DMG_PATH }}
            cURL-*-sources.zip
            sbom/*.json
          if-no-files-found: error

  publish:
    name: Attest and publish finalized release
    needs: [version, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: finalized-release
          path: final
      - name: generate dependency and security release notes
        run: |
          python3 .github/scripts/release_notes.py --version "$RELEASE_VERSION" \
            --output "$RUNNER_TEMP/release-notes.md" \
            "final/sbom/${PRODUCT_NAME}-${RELEASE_VERSION}.zip.inventory.json" \
            "final/sbom/${PRODUCT_NAME}-${RELEASE_VERSION}.dmg.inventory.json"
      - name: attest provenance of final containers, source delivery and sidecars
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            final/*.zip
            final/*.dmg
            final/sbom/*.json
      - name: attest ZIP CycloneDX SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: final/${{ env.PRODUCT_NAME }}-${{ env.RELEASE_VERSION }}.zip
          sbom-path: final/sbom/${{ env.PRODUCT_NAME }}-${{ env.RELEASE_VERSION }}.zip.cdx.json
      - name: attest ZIP SPDX SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: final/${{ env.PRODUCT_NAME }}-${{ env.RELEASE_VERSION }}.zip
          sbom-path: final/sbom/${{ env.PRODUCT_NAME }}-${{ env.RELEASE_VERSION }}.zip.spdx.json
      - name: attest DMG CycloneDX SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: final/${{ env.PRODUCT_NAME }}-${{ env.RELEASE_VERSION }}.dmg
          sbom-path: final/sbom/${{ env.PRODUCT_NAME }}-${{ env.RELEASE_VERSION }}.dmg.cdx.json
      - name: attest DMG SPDX SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: final/${{ env.PRODUCT_NAME }}-${{ env.RELEASE_VERSION }}.dmg
          sbom-path: final/sbom/${{ env.PRODUCT_NAME }}-${{ env.RELEASE_VERSION }}.dmg.spdx.json
      - name: create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/release_version.py publish --sha "$GITHUB_SHA" \
            --version "$RELEASE_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" \
            final/*.zip final/*.dmg final/sbom/*.json
