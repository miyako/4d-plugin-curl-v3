# Source-only manual maintenance; Build is a separate manual decision.
name: Bump version

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Semantic version bump
        options:
          - patch
          - minor
          - major
        default: patch
        required: true

permissions:
  contents: write

concurrency:
  group: bump-curl-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Validate and bump only the selected branch source
        env:
          MODE: ${{ inputs.mode }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 .github/scripts/release_version.py bump "$MODE" --sha "$EVENT_SHA" --ref "$EVENT_REF"
