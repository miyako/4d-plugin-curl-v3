name: Isolated provider compiler materials

on:
  workflow_call:

permissions:
  contents: read

jobs:
  provider-materials:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x86_64
          - os: windows-latest
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Material and assembler evidence guards
        run: |
          python -m unittest discover -s build/dependencies -p test_iconv.py
          python -m unittest discover -s build/sbom -p test_provider_materials.py
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: openssl/openssl
          ref: f4dc4d58b48d346a8270183f89acf826d459b0ca # OpenSSL 3.5.8
          path: openssl-source
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: google/brotli
          ref: db24a98aed38a16de78cc05ca15cdd8dc2a0d92d # Brotli 1.2.1
          path: brotli-source
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
        with:
          arch: x64
          toolset: '14.44'
      - name: Resolve the required Windows assembler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm -y --no-progress
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Fresh matching OpenSSL material build
        shell: python
        run: |
          import os, subprocess, sys
          from pathlib import Path
          subprocess.run([sys.executable, "build/dependencies/build_openssl_materials.py",
            "--source", "openssl-source",
            "--output", str(Path(os.environ["RUNNER_TEMP"]) / "provider-openssl"),
            "--target", "${{ matrix.target }}",
            "--commit", "f4dc4d58b48d346a8270183f89acf826d459b0ca"], check=True)
      - name: Fresh matching Brotli material build
        if: ${{ !cancelled() }}
        shell: python
        run: |
          import os, subprocess, sys
          from pathlib import Path
          subprocess.run([sys.executable, "build/dependencies/build_brotli_materials.py",
            "--source", "brotli-source",
            "--output", str(Path(os.environ["RUNNER_TEMP"]) / "provider-brotli"),
            "--target", "${{ matrix.target }}",
            "--commit", "db24a98aed38a16de78cc05ca15cdd8dc2a0d92d"], check=True)
      - name: Standalone provider TLS authentication and rejection checks
        if: ${{ !cancelled() }}
        shell: python
        run: |
          import os, subprocess, sys
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          subprocess.run([sys.executable, "build/dependencies/probe_provider_tls.py",
            "--openssl", str(root / "provider-openssl/install"),
            "--output", str(root / "provider-tls")], check=True)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: isolated-provider-materials-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/provider-openssl/
            ${{ runner.temp }}/provider-brotli/
            ${{ runner.temp }}/provider-tls/
          include-hidden-files: true
          if-no-files-found: error
