name: Release SBOM proof of concept

on:
  pull_request:
    paths:
      - 'build/sbom/**'
      - '.github/workflows/sbom.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/build-brotli.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release to analyze (no release assets will be changed)
        required: true
        default: v4.9.6

permissions:
  contents: read

jobs:
  sbom:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: install schema validator
        run: python -m pip install -q -r build/sbom/requirements.txt
      - name: run focused regression tests
        run: python -m unittest discover -s build/sbom -p 'test_*.py'
      - name: download existing release containers (read only)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || 'v4.9.6' }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release tag" >&2; exit 1; }
          VERSION="${RELEASE_TAG#v}"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir artifacts \
            --pattern "cURL-$VERSION.zip" --pattern "cURL-$VERSION.dmg"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: generate artifact-scoped SBOMs without executing the plugin
        run: |
          set -euo pipefail
          python build/sbom/generate.py generate --version "$RELEASE_VERSION" --output sbom \
            "artifacts/cURL-$RELEASE_VERSION.zip" "artifacts/cURL-$RELEASE_VERSION.dmg"
          python build/sbom/validate.py --version "$RELEASE_VERSION" --output sbom \
            --schema-dir "$RUNNER_TEMP/sbom-schemas" \
            "artifacts/cURL-$RELEASE_VERSION.zip" "artifacts/cURL-$RELEASE_VERSION.dmg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sbom-poc
          path: sbom/*.json
          if-no-files-found: error
