name: Isolated native source prerequisites

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: native-dependencies-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iconv-prerequisites:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: GNU source and conversion evidence guards
        run: python -m unittest discover -s build/dependencies -p 'test_iconv.py'
      - name: Acquire the reviewed release archive
        shell: python
        env:
          TARGET: ${{ matrix.target }}
        run: |
          import json, os, urllib.request
          from pathlib import Path
          lock = json.loads(Path("build/dependencies/native-sources.json").read_text())
          pin = next(p for p in lock["sourceArchives"]
                     if p["library"] == "libiconv" and os.environ["TARGET"] in p["targets"])
          urllib.request.urlretrieve(pin["url"], Path(os.environ["RUNNER_TEMP"]) / "libiconv.tar.gz")
      - name: Build source iconv and compare exact selected baseline
        shell: bash
        run: |
          set -euo pipefail
          python build/dependencies/build_iconv.py build \
            --archive "$RUNNER_TEMP/libiconv.tar.gz" --target "${{ matrix.target }}" \
            --output "$RUNNER_TEMP/native-libiconv"
          python build/dependencies/build_iconv.py inspect "$RUNNER_TEMP/native-libiconv"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-libiconv-${{ matrix.target }}
          path: ${{ runner.temp }}/native-libiconv/
          if-no-files-found: error
          include-hidden-files: true

  http-prerequisites:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos-arm64
            library: nghttp2
            repository: nghttp2/nghttp2
            source: 85e300c79fb6dbcfa9c1013215c8710c1c2cd3d2
          - os: macos-15-intel
            target: macos-x86_64
            library: nghttp2
            repository: nghttp2/nghttp2
            source: 85e300c79fb6dbcfa9c1013215c8710c1c2cd3d2
          - os: windows-latest
            target: windows-x86_64
            library: nghttp2
            repository: nghttp2/nghttp2
            source: 85e300c79fb6dbcfa9c1013215c8710c1c2cd3d2
          - os: macos-latest
            target: macos-arm64
            library: nghttp3
            repository: ngtcp2/nghttp3
            source: d326f4c1eb3f6a780d77793b30e16756c498f913
          - os: macos-15-intel
            target: macos-x86_64
            library: nghttp3
            repository: ngtcp2/nghttp3
            source: d326f4c1eb3f6a780d77793b30e16756c498f913
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.source }}
          path: http-source
          persist-credentials: false
      - name: Acquire only required parent-pinned test/parser submodules
        shell: bash
        env:
          LIBRARY: ${{ matrix.library }}
        run: |
          set -euo pipefail
          modules=(tests/munit)
          if [ "$LIBRARY" = nghttp3 ]; then modules+=(lib/sfparse); fi
          git -C http-source -c core.autocrlf=false -c core.eol=lf \
            submodule update --init --depth 1 "${modules[@]}"
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Build source HTTP prerequisite and run upstream tests
        shell: bash
        run: |
          set -euo pipefail
          python build/dependencies/build_http.py build --source http-source \
            --library "${{ matrix.library }}" --target "${{ matrix.target }}" \
            --output "$RUNNER_TEMP/native-http"
          python build/dependencies/build_http.py inspect "$RUNNER_TEMP/native-http"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-${{ matrix.library }}-${{ matrix.target }}
          path: ${{ runner.temp }}/native-http/
          if-no-files-found: error
          include-hidden-files: true

  source-prerequisites:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos-arm64
            source: da607da739fa6047df13e66a2af6b8bec7c2a498
          - os: macos-15-intel
            target: macos-x86_64
            source: da607da739fa6047df13e66a2af6b8bec7c2a498
          - os: windows-latest
            target: windows-x86_64
            source: 51b7f2abdade71cd9bb0e7a373ef2610ec6f9daf
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Evidence regression tests
        run: python -m unittest discover -s build/dependencies
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: madler/zlib
          ref: ${{ matrix.source }}
          path: zlib-source
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Build source zlib and compare exact selected baseline
        shell: bash
        run: |
          set -euo pipefail
          python build/dependencies/build_native.py build --library zlib \
            --source zlib-source --target "${{ matrix.target }}" \
            --output "$RUNNER_TEMP/native-zlib"
          python build/dependencies/build_native.py inspect "$RUNNER_TEMP/native-zlib"
      - name: Record 4D host availability without launching
        shell: python
        run: |
          import json, os, platform
          from pathlib import Path
          roots = [Path("/Applications")] if platform.system() == "Darwin" else [
              Path(os.environ["ProgramFiles"]) / "4D",
              Path(os.environ["ProgramFiles"]) / "4D SAS"]
          matches = [str(p) for root in roots if root.exists()
                     for p in (root.glob("4D*/4D.app") if platform.system() == "Darwin"
                               else root.glob("*/4D.exe"))]
          path = Path(os.environ["RUNNER_TEMP"]) / "native-zlib" / "host-availability.json"
          path.write_text(json.dumps({"platform": platform.platform(),
              "hostCandidates": matches, "hostInitialized": False,
              "scope": "bounded default installation-path check, not a host test"}, indent=2))
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-zlib-${{ matrix.target }}
          path: ${{ runner.temp }}/native-zlib/
          if-no-files-found: error
          include-hidden-files: true

  curl-baseline:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x86_64
          - os: windows-latest
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Curl and SSH evidence guards
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s build/dependencies -p 'test_curl_observation.py'
          python -m unittest discover -s build/dependencies -p 'test_ssh.py'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: libssh2/libssh2
          ref: a312b43325e3383c865a87bb1d26cb52e3292641 # libssh2-1.11.1 (source banner 1.11.1_DEV)
          path: libssh2-source
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: google/brotli
          ref: db24a98aed38a16de78cc05ca15cdd8dc2a0d92d # Brotli 1.2.1
          path: brotli-source
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: openssl/openssl
          ref: f4dc4d58b48d346a8270183f89acf826d459b0ca # OpenSSL 3.5.8
          path: openssl-source
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Make missing Windows assembler available
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm -y --no-progress
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Prepare provider evidence directory
        shell: python
        run: |
          import os
          from pathlib import Path
          (Path(os.environ["RUNNER_TEMP"]) / "curl-evidence").mkdir()
      - name: Rebuild matching native static Brotli provider
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          arguments=(-G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
            "-DCMAKE_INSTALL_PREFIX=$RUNNER_TEMP/baseline-brotli-install")
          if [ "$RUNNER_OS" = Windows ]; then
            arguments+=(-DCMAKE_POLICY_DEFAULT_CMP0091=NEW
              -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded)
          else
            arguments+=("-DCMAKE_OSX_ARCHITECTURES=${TARGET#macos-}"
              -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13)
          fi
          cmake -S brotli-source -B "$RUNNER_TEMP/baseline-brotli-build" "${arguments[@]}" \
            > "$RUNNER_TEMP/curl-evidence/brotli-configure.log" 2>&1
          cmake --build "$RUNNER_TEMP/baseline-brotli-build" --parallel 3 \
            > "$RUNNER_TEMP/curl-evidence/brotli-build.log" 2>&1
          ctest --test-dir "$RUNNER_TEMP/baseline-brotli-build" --output-on-failure --no-tests=error \
            > "$RUNNER_TEMP/curl-evidence/brotli-tests.log" 2>&1
          cmake --install "$RUNNER_TEMP/baseline-brotli-build" \
            > "$RUNNER_TEMP/curl-evidence/brotli-install.log" 2>&1
          if [ "$RUNNER_OS" = Windows ]; then
            mkdir -p "$RUNNER_TEMP/baseline-brotli/lib/64"
            cp "$RUNNER_TEMP"/baseline-brotli-install/lib/brotli*.lib \
              "$RUNNER_TEMP/baseline-brotli/lib/64/"
          else
            mkdir -p "$RUNNER_TEMP/baseline-brotli/a"
            cp "$RUNNER_TEMP"/baseline-brotli-install/lib/libbrotli*.a \
              "$RUNNER_TEMP/baseline-brotli/a/"
          fi
          python build/sbom/generate.py brotli --source brotli-source \
            --vendor "$RUNNER_TEMP/baseline-brotli"
      - name: Rebuild matching OpenSSL macOS provider
        if: runner.os == 'macOS'
        shell: bash
        working-directory: openssl-source
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          arch="${TARGET#macos-}"
          ./Configure "darwin64-${arch}-cc" no-shared no-tests \
            -mmacosx-version-min=10.13 --prefix="$PWD/out" \
            > "$RUNNER_TEMP/curl-evidence/openssl-configure.log" 2>&1
          if ! make -j3 > "$RUNNER_TEMP/curl-evidence/openssl-build.log" 2>&1; then
            cat "$RUNNER_TEMP/curl-evidence/openssl-build.log"
            exit 1
          fi
          make install_sw > "$RUNNER_TEMP/curl-evidence/openssl-install.log" 2>&1
          python ../build/sbom/provenance.py source-record --source . --install out \
            --target "$TARGET" -- "darwin64-${arch}-cc" no-shared no-tests \
            -mmacosx-version-min=10.13 --prefix="$PWD/out"
          python ../build/sbom/provenance.py verify --source . --install out \
            --target "$TARGET" -- "darwin64-${arch}-cc" no-shared no-tests \
            -mmacosx-version-min=10.13 --prefix="$PWD/out"
      - name: Rebuild matching OpenSSL Windows provider
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: openssl-source
        run: |
          perl Configure VC-WIN64A no-shared no-tests -MT --release --prefix=%CD%\out --openssldir=%CD%\out\ssl > "%RUNNER_TEMP%\curl-evidence\openssl-configure.log" 2>&1
          if errorlevel 1 exit /b 1
          nmake > "%RUNNER_TEMP%\curl-evidence\openssl-build.log" 2>&1
          if errorlevel 1 (type "%RUNNER_TEMP%\curl-evidence\openssl-build.log" & exit /b 1)
          nmake install_sw > "%RUNNER_TEMP%\curl-evidence\openssl-install.log" 2>&1
          if errorlevel 1 exit /b 1
          python ..\build\sbom\provenance.py source-record --source . --install out --target windows-x86_64 -- VC-WIN64A no-shared no-tests -MT --release --prefix=%CD%\out --openssldir=%CD%\out\ssl
          if errorlevel 1 exit /b 1
          python ..\build\sbom\provenance.py verify --source . --install out --target windows-x86_64 -- VC-WIN64A no-shared no-tests -MT --release --prefix=%CD%\out --openssldir=%CD%\out\ssl
          if errorlevel 1 exit /b 1
      - name: Observe exact baseline curl without loading the plugin or making transfers
        shell: bash
        run: |
          set -euo pipefail
          python build/dependencies/observe_curl.py observe \
            --target "${{ matrix.target }}" --openssl-install openssl-source/out \
            --brotli-vendor "$RUNNER_TEMP/baseline-brotli" \
            --output "$RUNNER_TEMP/curl-evidence/observation"
          python build/dependencies/observe_curl.py inspect "$RUNNER_TEMP/curl-evidence/observation"
      - name: Build isolated version-matched SSH and compare actual algorithm configuration
        shell: bash
        run: |
          set -euo pipefail
          python build/dependencies/build_ssh.py build \
            --source libssh2-source --target "${{ matrix.target }}" \
            --openssl-install openssl-source/out \
            --baseline "$RUNNER_TEMP/curl-evidence/observation" \
            --output "$RUNNER_TEMP/native-libssh2"
          python build/dependencies/build_ssh.py inspect "$RUNNER_TEMP/native-libssh2"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-libssh2-${{ matrix.target }}
          path: ${{ runner.temp }}/native-libssh2/
          if-no-files-found: warn
          include-hidden-files: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: baseline-curl-${{ matrix.target }}
          path: ${{ runner.temp }}/curl-evidence/
          if-no-files-found: error
          include-hidden-files: true
