name: Unsigned native linker trace

on:
  pull_request:
    paths:
      - 'build/sbom/**'
      - 'build/dependencies/**'
      - '.github/workflows/native-trace.yml'
      - '.github/workflows/build-brotli.yml'
      - 'cURL.xcodeproj/**'
      - 'cURL.vcxproj'
      - '*.cpp'
      - '*.h'
      - 'support/**'
      - '4D Plugin API/**'
      - 'include/**'
      - 'a/**'
      - 'lib/**'
  workflow_dispatch:
    inputs:
      proxy-candidate-only:
        description: 'Only build/test the isolated proxy source candidate (no plugin or release changes)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-trace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proxy-candidate:
    name: Isolated proxy candidate (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x86_64
          - os: windows-latest
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Evidence regression tests
        run: python -m unittest discover -s build/dependencies
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: libproxy/libproxy
          ref: e78a5ccfe0a2340f2c73e419767f8492ffc2787a
          path: proxy-source
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Build candidate and compare exact historical proxy archives
        shell: bash
        run: |
          set -euo pipefail
          python build/dependencies/build_proxy.py build --source proxy-source \
            --output "$RUNNER_TEMP/proxy-candidate" --target "${{ matrix.target }}"
          python build/dependencies/build_proxy.py verify --source proxy-source \
            --output "$RUNNER_TEMP/proxy-candidate" --target "${{ matrix.target }}"
          python build/dependencies/inspect_proxy.py "$RUNNER_TEMP/proxy-candidate"
          python build/dependencies/relink_candidate.py --candidate "$RUNNER_TEMP/proxy-candidate" \
            --output "$RUNNER_TEMP/proxy-relink"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: isolated-proxy-${{ matrix.target }}
          path: ${{ runner.temp }}/proxy-candidate/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: isolated-proxy-relink-${{ matrix.target }}
          path: ${{ runner.temp }}/proxy-relink/
          if-no-files-found: error

  brotli:
    if: ${{ !inputs.proxy-candidate-only }}
    uses: ./.github/workflows/build-brotli.yml

  native:
    needs: brotli
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      OPENSSL_TAG: openssl-3.5.8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Parser regression tests
        run: python -m unittest discover -s build/sbom -p test_linker.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: brotli-${{ runner.os }}
          path: .
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: openssl/openssl
          ref: ${{ env.OPENSSL_TAG }}
          path: openssl-src
          persist-credentials: false
      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
        if: runner.os == 'Windows'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Install NASM
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build source OpenSSL Windows static MT
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: openssl-src
        run: |
          perl Configure VC-WIN64A no-shared no-tests -MT --release --prefix=%CD%\out-win64 --openssldir=%CD%\out-win64\ssl
          if errorlevel 1 exit /b 1
          nmake
          if errorlevel 1 exit /b 1
          nmake install_sw
          if errorlevel 1 exit /b 1
          python ..\build\sbom\provenance.py source-record --source . --install out-win64 --target windows-x86_64 -- VC-WIN64A no-shared no-tests -MT --release --prefix=%CD%\out-win64 --openssldir=%CD%\out-win64\ssl
          if errorlevel 1 exit /b 1
          python ..\build\sbom\provenance.py verify --source . --install out-win64 --target windows-x86_64 -- VC-WIN64A no-shared no-tests -MT --release --prefix=%CD%\out-win64 --openssldir=%CD%\out-win64\ssl
          if errorlevel 1 exit /b 1
          copy /Y out-win64\lib\libssl.lib ..\lib\64\libssl.lib
          if errorlevel 1 exit /b 1
          copy /Y out-win64\lib\libcrypto.lib ..\lib\64\libcrypto.lib
          if errorlevel 1 exit /b 1
          python ..\build\sbom\provenance.py combine --record out-win64\openssl-build-provenance.json --vendor .. --target windows-x86_64
          if errorlevel 1 exit /b 1
      - name: Build source OpenSSL macOS universal
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cp -R openssl-src openssl-x86_64
          for arch in arm64 x86_64; do
            src=openssl-src
            if [ "$arch" = x86_64 ]; then src=openssl-x86_64; fi
            (
              cd "$src"
              ./Configure "darwin64-${arch}-cc" no-shared no-tests \
                -mmacosx-version-min=10.13 --prefix="$PWD/out"
              make -j3
              make install_sw
              python ../build/sbom/provenance.py source-record --source . --install out \
                --target "macos-$arch" -- "darwin64-${arch}-cc" no-shared no-tests \
                -mmacosx-version-min=10.13 --prefix="$PWD/out"
              python ../build/sbom/provenance.py verify --source . --install out \
                --target "macos-$arch" -- "darwin64-${arch}-cc" no-shared no-tests \
                -mmacosx-version-min=10.13 --prefix="$PWD/out"
            )
          done
          for lib in ssl crypto; do
            lipo -create "openssl-src/out/lib/lib${lib}.a" \
              "openssl-x86_64/out/lib/lib${lib}.a" -output "a/lib${lib}.a"
          done
          python build/sbom/provenance.py combine \
            --record openssl-src/out/openssl-build-provenance.json \
            --record openssl-x86_64/out/openssl-build-provenance.json \
            --vendor . --target macos-universal
      - name: Snapshot repository candidate hashes before link
        shell: python
        run: |
          import hashlib, json, os, subprocess, sys
          from pathlib import Path
          paths = sorted([*Path("a").rglob("*.a"), *Path("lib/64").rglob("*.lib")])
          Path("native-trace").mkdir(exist_ok=True)
          Path("native-trace/candidates.json").write_text(json.dumps([
              {"path": p.as_posix(), "sha256": hashlib.sha256(p.read_bytes()).hexdigest()}
              for p in paths], indent=2))
          subprocess.run([sys.executable, "build/sbom/generate.py", "sources",
              "--target", "macos-universal" if os.environ["RUNNER_OS"] == "macOS" else "windows-x86_64",
              "--output", "native-trace/embedded-sources.json"], check=True)
      - name: Build actual plugin unsigned macOS and capture per-architecture maps
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project cURL.xcodeproj -target cURL -configuration Default \
            -xcconfig "$PWD/build/sbom/diagnostics.xcconfig" \
            "NATIVE_TRACE_DIRECTORY=$PWD/native-trace" \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO MACOSX_DEPLOYMENT_TARGET=10.13 \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee native-trace/xcodebuild.log
          lipo test/Plugins/cURL.bundle/Contents/MacOS/cURL -verify_arch arm64 x86_64
          for arch in arm64 x86_64; do
            python build/sbom/linker.py --target "macos-$arch" \
              --map "native-trace/cURL-$arch.map" \
              --candidates native-trace/candidates.json \
              --output "native-trace/link-$arch.json"
          done
      - name: Build actual plugin Windows and capture MSVC map and verbose log
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          msbuild cURL.vcxproj /t:Rebuild /p:Configuration=Release /p:Platform=x64 `
            /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 `
            "/p:ForceImportAfterCppTargets=$PWD\build\sbom\diagnostics.props" `
            "/p:NativeTraceDirectory=$PWD\native-trace" /m:1 /nologo /v:normal `
            /fl "/flp:logfile=$PWD\native-trace\msbuild.log;verbosity=normal;encoding=UTF-8"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (!(Test-Path test/Plugins/cURL.bundle/Contents/Windows64/cURL.4DX)) {
            throw 'Missing linked plugin'
          }
          python build/sbom/linker.py --target windows-x86_64 `
            --map native-trace/cURL-x64.map --verbose native-trace/msbuild.log `
            --candidates native-trace/candidates.json --output native-trace/link-x64.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Require actual archive selections and bind unsigned binary hash
        shell: python
        run: |
          import hashlib, json, os
          from pathlib import Path
          binary = Path("test/Plugins/cURL.bundle/Contents") / (
              "MacOS/cURL" if os.environ["RUNNER_OS"] == "macOS" else "Windows64/cURL.4DX")
          for path in Path("native-trace").glob("link-*.json"):
              evidence = json.loads(path.read_text())
              if not evidence["selectedArchives"]:
                  raise RuntimeError("No archive selections parsed from actual linker output")
              evidence["binarySha256"] = hashlib.sha256(binary.read_bytes()).hexdigest()
              path.write_text(json.dumps(evidence, indent=2) + "\n")
      - name: Collect manifest, source-build and actual linker evidence for SBOM ingestion
        shell: python
        run: |
          import os, subprocess, sys
          mac = os.environ["RUNNER_OS"] == "macOS"
          command = [
              sys.executable, "build/sbom/generate.py", "inputs",
              "--target", "macos-universal" if mac else "windows-x86_64",
              "--binary", "test/Plugins/cURL.bundle/Contents/" + (
                  "MacOS/cURL" if mac else "Windows64/cURL.4DX"),
              "--manifest", "build/sbom/native-archives.json",
              "--embedded-sources",
              "--embedded-source-snapshot", "native-trace/embedded-sources.json",
              "--brotli-provenance", "brotli-provenance.json",
              "--openssl-provenance", "openssl-provenance.json",
              "--output", "native-trace/build-evidence.json",
          ]
          if mac:
              for arch in ("arm64", "x86_64"):
                  command.extend(["--link-map", f"macos-{arch}=native-trace/cURL-{arch}.map"])
          else:
              command.extend(["--link-map", "windows-x86_64=native-trace/cURL-x64.map",
                              "--link-log", "native-trace/msbuild.log"])
          subprocess.run(command, check=True)
      - name: Upload unsigned macOS build and ingestion evidence
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-native-build-macOS
          path: |
            test/Plugins/cURL.bundle/
            native-trace/build-evidence.json
            brotli-provenance.json
            openssl-provenance.json
          if-no-files-found: error
      - name: Upload unsigned Windows build and ingestion evidence
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-native-build-Windows
          path: |
            test/Plugins/cURL.bundle/Contents/Windows64/cURL.4DX
            native-trace/build-evidence.json
            brotli-provenance.json
            openssl-provenance.json
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: unsigned-native-trace-${{ runner.os }}
          path: native-trace/
          if-no-files-found: error

  package-sbom:
    name: Validate unsigned ZIP and DMG native SBOMs
    needs: native
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r build/sbom/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-native-build-macOS
          path: macos
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-native-build-Windows
          path: windows
      - name: Package unsigned cross-platform test containers without publishing
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE=macos/test/Plugins/cURL.bundle
          mkdir -p "$BUNDLE/Contents/Windows64"
          cp windows/test/Plugins/cURL.bundle/Contents/Windows64/cURL.4DX "$BUNDLE/Contents/Windows64/cURL.4DX"
          # Do not carry the repository's stale signature resources into an unsigned test package.
          rm -f "$BUNDLE/Contents/_CodeSignature/CodeResources"
          VERSION=$(python -c 'import plistlib; print(plistlib.load(open("macos/test/Plugins/cURL.bundle/Contents/Info.plist", "rb"))["CFBundleShortVersionString"])')
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          ditto -c -k --keepParent "$BUNDLE" unsigned-native.zip
          hdiutil create -format UDBZ -volname native-trace -srcfolder "$BUNDLE" unsigned-native.dmg
      - name: Generate and validate all six artifact-bound documents
        shell: bash
        run: |
          set -euo pipefail
          python build/sbom/generate.py generate --version "$RELEASE_VERSION" --output sbom \
            --evidence macos/native-trace/build-evidence.json \
            --evidence windows/native-trace/build-evidence.json \
            unsigned-native.zip unsigned-native.dmg
          python build/sbom/validate.py --version "$RELEASE_VERSION" --output sbom \
            --schema-dir "$RUNNER_TEMP/sbom-schemas" unsigned-native.zip unsigned-native.dmg
      - name: Require complete selected-package and embedded-source coverage
        shell: python
        run: |
          import json
          from pathlib import Path
          manifest = json.loads(Path("build/sbom/native-archives.json").read_text())
          zlib_archive = next(a for a in manifest["archives"] if a["path"] == "lib/64/zlib.lib")
          expected_zlib = zlib_archive["targets"]["windows-x86_64"]["identities"][0]["version"]
          for path in Path("sbom").glob("*.inventory.json"):
              inventory = json.loads(path.read_text())
              for target in inventory["targets"]:
                  coverage = target["selectedArchiveCoverage"]
                  if coverage["uncoveredArchives"] or coverage["namedPackageArchives"] != coverage["selectedRepositoryArchives"]:
                      raise RuntimeError(f"{target['id']}: selected archive/package coverage regressed")
                  expected_selected, expected_versioned = (11, 9) if target["id"].startswith("windows") else (12, 10)
                  if (coverage["selectedRepositoryArchives"], coverage["versionedPackageArchives"]) != (expected_selected, expected_versioned):
                      raise RuntimeError(f"{target['id']}: actual selected/versioned archive counts changed")
                  print(f"{path.name}: {target['id']}: {coverage}")
                  packages = {p["name"]: p for p in target["dependencies"]}
                  for name in ("Brotli", "OpenSSL"):
                      package = packages[name]
                      if not package.get("selectedArchives") or not package.get("license") or not package.get("purl"):
                          raise RuntimeError(f"{target['id']}: missing usable source identity for {name}")
                  expected = {"libiconv": "1.18" if target["id"].startswith("windows") else "1.16",
                              "nghttp2": "1.70.0"}
                  if target["id"].startswith("macos"):
                      expected["nghttp3"] = "1.15.0"
                  elif "nghttp3" in packages:
                      raise RuntimeError("nghttp3 must not be inferred on Windows")
                  for name, version in expected.items():
                      if packages[name].get("version") != version or not packages[name].get("selectedArchives"):
                          raise RuntimeError(f"{target['id']}: incorrect selected {name} identity")
                  if coverage["unknownVersionPackages"] != ["libmodman", "libproxy"]:
                      raise RuntimeError("Unknown-version selected packages changed; review evidence explicitly")
                  expected_sources = {"ftpparse", "4D Plugin SDK"}
                  actual_sources = {p["name"] for p in target["dependencies"]
                                    if p.get("evidenceType") == "build-derived-embedded-source"}
                  if actual_sources != expected_sources:
                      raise RuntimeError(f"{target['id']}: embedded compiled-source coverage changed")
                  if packages["ftpparse"].get("license") != "LicenseRef-ftpparse-public-domain":
                      raise RuntimeError("ftpparse public-domain statement must not be relabeled")
                  source = target["buildEvidence"]["embeddedSourceEvidence"]
                  first_party = {p["name"] for p in source["components"]
                                 if p["scope"] == "first-party-product-source"}
                  if first_party != {"4D plugin C++ wrappers", "4DPlugin-JSON helper", "ufopen UTF-8 path helper"}:
                      raise RuntimeError("First-party product source inventory changed")
                  if first_party.intersection(packages) or any("JsonCpp" in p for p in packages):
                      raise RuntimeError("Product helpers or obsolete JsonCpp promoted to dependencies")
                  sdk = packages["4D Plugin SDK"]
                  if sdk.get("sourceCommit") != "ad7944bc7a13d93db8097c4c8ff55ba2f6e36f86" or not sdk.get("purl"):
                      raise RuntimeError("Missing immutable SDK source identity")
                  if target["id"] == "windows-x86_64":
                      zlib = packages["zlib"]
                      selected = {a["candidatePath"] for a in zlib.get("selectedArchives", [])}
                      if zlib["version"] != expected_zlib or "lib/64/zlib.lib" not in selected or "lib/64/zs.lib" in selected:
                          raise RuntimeError("Windows zlib selection disagrees with the exact-hash manifest")
                      print(f"{path.name}: Windows zlib {zlib['version']} from zlib.lib; zs.lib not promoted")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-native-sboms
          path: sbom/*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-native-containers
          path: |
            unsigned-native.zip
            unsigned-native.dmg
          if-no-files-found: error
