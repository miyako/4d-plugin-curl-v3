name: Unsigned native linker trace

on:
  pull_request:
    paths:
      - 'build/sbom/**'
      - 'build/dependencies/**'
      - '.github/workflows/native-trace.yml'
      - '.github/workflows/build-brotli.yml'
      - 'cURL.xcodeproj/**'
      - 'cURL.vcxproj'
      - '*.cpp'
      - '*.h'
      - 'support/**'
      - '4D Plugin API/**'
      - 'include/**'
      - 'a/**'
      - 'lib/**'
  workflow_dispatch:
    inputs:
      proxy-candidate-only:
        description: 'Only build/test the isolated proxy source candidate (no plugin or release changes)'
        type: boolean
        default: false
      native-prerequisites-only:
        description: 'Only source prerequisites and baseline curl observations (no plugin or signing)'
        type: boolean
        default: false
      native-prerequisite-scope:
        description: 'Isolated prerequisite jobs to run (only applies with native-prerequisites-only)'
        type: choice
        options: [all, iconv, curl, inventory, providers]
        default: all
      native-provider-run:
        description: 'Original successful prerequisite producer run for curl/inventory assembly'
        type: string
        default: ''
      native-curl-provider-run:
        description: 'Original curl source run for inventory-only reuse'
        type: string
        default: ''
      native-iconv-provider-run:
        description: 'Optional original successful GNU source run for inventory assembly'
        type: string
        default: ''
      native-proxy-provider-run:
        description: 'Optional original successful schema2 proxy run for inventory assembly'
        type: string
        default: ''
      native-candidate-plugin-only:
        description: 'Build/package isolated source-candidate plugins; no adoption, signing or release'
        type: boolean
        default: false
      native-candidate-inventory-run:
        description: 'Original successful complete source inventory run for isolated plugin validation'
        type: string
        default: ''
      native-materials-provider-run:
        description: 'Optional successful measured OpenSSL/Brotli/TLS run for isolated candidate plugins'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: native-trace-${{ github.ref }}-${{ inputs.native-prerequisite-scope || 'all' }}
  cancel-in-progress: true

jobs:
  native-prerequisites:
    if: ${{ inputs.native-prerequisites-only && inputs.native-prerequisite-scope != 'curl' && inputs.native-prerequisite-scope != 'inventory' && inputs.native-prerequisite-scope != 'providers' }}
    uses: ./.github/workflows/native-dependencies.yml
    with:
      scope: ${{ inputs.native-prerequisite-scope || 'all' }}

  source-providers:
    if: ${{ inputs.native-prerequisites-only && inputs.native-prerequisite-scope == 'providers' }}
    uses: ./.github/workflows/native-provider-materials.yml

  curl-source:
    if: ${{ inputs.native-prerequisites-only && (inputs.native-prerequisite-scope == 'curl' || inputs.native-prerequisite-scope == 'inventory') }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/native-curl-source.yml
    with:
      provider-run-id: ${{ inputs.native-provider-run }}
      inventory-only: ${{ inputs.native-prerequisite-scope == 'inventory' }}
      source-run-id: ${{ inputs.native-curl-provider-run }}
      iconv-provider-run-id: ${{ inputs.native-iconv-provider-run }}
      proxy-provider-run-id: ${{ inputs.native-proxy-provider-run }}

  proxy-candidate:
    if: ${{ !inputs.native-prerequisites-only && !inputs.native-candidate-plugin-only }}
    name: Isolated proxy candidate (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x86_64
          - os: windows-latest
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Evidence regression tests
        run: python -m unittest discover -s build/dependencies
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: libproxy/libproxy
          ref: e78a5ccfe0a2340f2c73e419767f8492ffc2787a
          path: proxy-source
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
        with:
          arch: x64
          toolset: '14.4'
      - name: Build candidate and compare exact historical proxy archives
        shell: bash
        run: |
          set -euo pipefail
          python build/dependencies/build_proxy.py build --source proxy-source \
            --output "$RUNNER_TEMP/proxy-candidate" --target "${{ matrix.target }}"
          python build/dependencies/build_proxy.py verify --source proxy-source \
            --output "$RUNNER_TEMP/proxy-candidate" --target "${{ matrix.target }}"
          python build/dependencies/inspect_proxy.py "$RUNNER_TEMP/proxy-candidate"
          python build/dependencies/relink_candidate.py --candidate "$RUNNER_TEMP/proxy-candidate" \
            --output "$RUNNER_TEMP/proxy-relink"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: isolated-proxy-${{ matrix.target }}
          path: ${{ runner.temp }}/proxy-candidate/
          if-no-files-found: error
          include-hidden-files: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: isolated-proxy-relink-${{ matrix.target }}
          path: ${{ runner.temp }}/proxy-relink/
          if-no-files-found: error
          include-hidden-files: true

  brotli:
    if: ${{ !inputs.proxy-candidate-only && !inputs.native-prerequisites-only && !inputs.native-candidate-plugin-only }}
    uses: ./.github/workflows/build-brotli.yml

  native:
    needs: brotli
    if: ${{ !cancelled() && (needs.brotli.result == 'success' || inputs.native-candidate-plugin-only) }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      OPENSSL_TAG: openssl-3.5.8
      PLUGIN_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Parser regression tests
        run: python -m unittest discover -s build/sbom -p test_linker.py
      - name: Verify the explicitly selected original candidate inventory producer
        if: ${{ inputs.native-candidate-plugin-only }}
        shell: python
        env:
          INVENTORY_RUN: ${{ inputs.native-candidate-inventory-run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          import json, os, sys, urllib.request
          from pathlib import Path
          sys.path.insert(0, "build/sbom")
          from native_provenance import verify_producer_run
          identifier = os.environ["INVENTORY_RUN"]
          if not identifier.isascii() or not identifier.isdigit():
              raise ValueError("An explicit numeric original source inventory run is required")
          base = os.environ["GITHUB_API_URL"] + "/repos/" + os.environ["GITHUB_REPOSITORY"]
          def get(path):
              request = urllib.request.Request(base + path, headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(request) as response:
                  return json.load(response)
          record = verify_producer_run(
              get("/actions/runs/" + identifier),
              get("/actions/runs/" + identifier + "/jobs?per_page=100&filter=all"),
              os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_REF_NAME"], "inventory")
          (Path(os.environ["RUNNER_TEMP"]) / "candidate-inventory-acquisition.json").write_text(
              json.dumps(record, indent=2))
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ inputs.native-candidate-plugin-only }}
        with:
          run-id: ${{ inputs.native-candidate-inventory-run }}
          github-token: ${{ github.token }}
          name: isolated-native-source-inventory
          path: ${{ runner.temp }}/candidate-inventory
      - name: Recheck all original source producers before acquiring their kits
        if: ${{ inputs.native-candidate-plugin-only }}
        id: candidate-providers
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          MATERIALS_RUN: ${{ inputs.native-materials-provider-run }}
        run: |
          import json, os, sys, urllib.request
          from pathlib import Path
          sys.path.insert(0, "build/sbom")
          from native_provenance import verify_producer_run
          root = Path(os.environ["RUNNER_TEMP"])
          original = json.loads((root / "candidate-inventory/acquisition.json").read_text())
          base = os.environ["GITHUB_API_URL"] + "/repos/" + os.environ["GITHUB_REPOSITORY"]
          def get(path):
              request = urllib.request.Request(base + path, headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(request) as response:
                  return json.load(response)
          records = {}
          for role, name in (("curl", "curl"), ("nghttp3", "http"),
                             ("libiconv", "iconv"), ("libproxy", "proxy")):
              identifier = str(original[role]["run"]["id"])
              if not identifier.isascii() or not identifier.isdigit():
                  raise ValueError("Original source producer IDs must be ASCII integers")
              records[role] = verify_producer_run(
                  get("/actions/runs/" + identifier),
                  get("/actions/runs/" + identifier + "/jobs?per_page=100&filter=all"),
                  os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_REF_NAME"], role)
              if records[role] != original[role]:
                  raise ValueError("Original source producer identity/attempt changed")
              with open(os.environ["GITHUB_OUTPUT"], "a") as stream:
                  stream.write(name + "=" + identifier + "\n")
          identifier = os.environ["MATERIALS_RUN"]
          if identifier:
              if not identifier.isascii() or not identifier.isdigit():
                  raise ValueError("Measured provider source run ID must be an ASCII integer")
              records["providers"] = verify_producer_run(
                  get("/actions/runs/" + identifier),
                  get("/actions/runs/" + identifier + "/jobs?per_page=100&filter=all"),
                  os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_REF_NAME"], "providers")
          (root / "candidate-source-acquisition.json").write_text(json.dumps(records, indent=2))
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ inputs.native-candidate-plugin-only && inputs.native-materials-provider-run != '' }}
        with:
          run-id: ${{ inputs.native-materials-provider-run }}
          github-token: ${{ github.token }}
          pattern: isolated-provider-materials-${{ runner.os == 'Windows' && 'windows-x86_64' || 'macos-*' }}
          path: ${{ runner.temp }}/candidate-provider-materials
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ inputs.native-candidate-plugin-only }}
        with:
          run-id: ${{ steps.candidate-providers.outputs.curl }}
          github-token: ${{ github.token }}
          pattern: native-libcurl-*
          path: ${{ runner.temp }}/candidate-kits
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ inputs.native-candidate-plugin-only && runner.os == 'macOS' }}
        with:
          run-id: ${{ steps.candidate-providers.outputs.http }}
          github-token: ${{ github.token }}
          pattern: native-nghttp3-*
          path: ${{ runner.temp }}/candidate-kits
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ inputs.native-candidate-plugin-only }}
        with:
          run-id: ${{ steps.candidate-providers.outputs.iconv }}
          github-token: ${{ github.token }}
          pattern: native-libiconv-*
          path: ${{ runner.temp }}/candidate-kits
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ inputs.native-candidate-plugin-only && runner.os == 'macOS' }}
        with:
          run-id: ${{ steps.candidate-providers.outputs.proxy }}
          github-token: ${{ github.token }}
          pattern: isolated-proxy-macos-*
          path: ${{ runner.temp }}/candidate-kits
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ inputs.native-candidate-plugin-only && runner.os == 'Windows' }}
        with:
          run-id: ${{ steps.candidate-providers.outputs.proxy }}
          github-token: ${{ github.token }}
          name: isolated-proxy-windows-x86_64
          path: ${{ runner.temp }}/candidate-kits/isolated-proxy-windows-x86_64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ inputs.native-candidate-plugin-only && runner.os == 'Windows' }}
        with:
          run-id: ${{ steps.candidate-providers.outputs.proxy }}
          github-token: ${{ github.token }}
          name: isolated-proxy-relink-windows-x86_64
          path: ${{ runner.temp }}/candidate-kits/isolated-proxy-relink-windows-x86_64
      - name: Prepare a fresh separate source-candidate plugin checkout
        if: ${{ inputs.native-candidate-plugin-only }}
        shell: python
        env:
          MATERIALS_RUN: ${{ inputs.native-materials-provider-run }}
        run: |
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, "build/sbom")
          from native_provenance import stage_project
          root = Path(os.environ["RUNNER_TEMP"])
          kits = root / "candidate-kits"
          mac = os.environ["RUNNER_OS"] == "macOS"
          targets = ("macos-arm64", "macos-x86_64") if mac else ("windows-x86_64",)
          selected = []
          for target in targets:
              curl = kits / ("native-libcurl-" + target)
              selected += [curl, *[curl / "providers" / n for n in ("ssh", "zlib", "http")],
                           kits / ("native-libiconv-" + target),
                           kits / ("isolated-proxy-" + target)]
              if mac:
                  selected.append(kits / ("native-nghttp3-" + target))
          materials = root / "candidate-provider-materials"
          provider_kits = [materials / ("isolated-provider-materials-" + target)
                           for target in targets] if os.environ["MATERIALS_RUN"] else []
          stage_project(Path.cwd(), root / "plugin-candidate",
                        "macos-universal" if mac else "windows-x86_64", selected, provider_kits)
          with open(os.environ["GITHUB_ENV"], "a") as stream:
              stream.write("PLUGIN_ROOT=" + str(root / "plugin-candidate/project") + "\n")
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ !inputs.native-candidate-plugin-only }}
        with:
          name: brotli-${{ runner.os }}
          path: .
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: ${{ !inputs.native-candidate-plugin-only }}
        with:
          repository: openssl/openssl
          ref: ${{ env.OPENSSL_TAG }}
          path: openssl-src
          persist-credentials: false
      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
        if: runner.os == 'Windows'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
        with:
          arch: x64
          toolset: ${{ inputs.native-candidate-plugin-only && '14.4' || '' }}
      - name: Install NASM
        if: ${{ runner.os == 'Windows' && !inputs.native-candidate-plugin-only }}
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build source OpenSSL Windows static MT
        if: ${{ runner.os == 'Windows' && !inputs.native-candidate-plugin-only }}
        shell: cmd
        working-directory: openssl-src
        run: |
          perl Configure VC-WIN64A no-shared no-tests -MT --release --prefix=%CD%\out-win64 --openssldir=%CD%\out-win64\ssl
          if errorlevel 1 exit /b 1
          nmake
          if errorlevel 1 exit /b 1
          nmake install_sw
          if errorlevel 1 exit /b 1
          python ..\build\sbom\provenance.py source-record --source . --install out-win64 --target windows-x86_64 -- VC-WIN64A no-shared no-tests -MT --release --prefix=%CD%\out-win64 --openssldir=%CD%\out-win64\ssl
          if errorlevel 1 exit /b 1
          python ..\build\sbom\provenance.py verify --source . --install out-win64 --target windows-x86_64 -- VC-WIN64A no-shared no-tests -MT --release --prefix=%CD%\out-win64 --openssldir=%CD%\out-win64\ssl
          if errorlevel 1 exit /b 1
          copy /Y out-win64\lib\libssl.lib ..\lib\64\libssl.lib
          if errorlevel 1 exit /b 1
          copy /Y out-win64\lib\libcrypto.lib ..\lib\64\libcrypto.lib
          if errorlevel 1 exit /b 1
          python ..\build\sbom\provenance.py combine --record out-win64\openssl-build-provenance.json --vendor .. --target windows-x86_64
          if errorlevel 1 exit /b 1
      - name: Build source OpenSSL macOS universal
        if: ${{ runner.os == 'macOS' && !inputs.native-candidate-plugin-only }}
        shell: bash
        run: |
          set -euo pipefail
          cp -R openssl-src openssl-x86_64
          for arch in arm64 x86_64; do
            src=openssl-src
            if [ "$arch" = x86_64 ]; then src=openssl-x86_64; fi
            (
              cd "$src"
              ./Configure "darwin64-${arch}-cc" no-shared no-tests \
                -mmacosx-version-min=10.13 --prefix="$PWD/out"
              make -j3
              make install_sw
              python ../build/sbom/provenance.py source-record --source . --install out \
                --target "macos-$arch" -- "darwin64-${arch}-cc" no-shared no-tests \
                -mmacosx-version-min=10.13 --prefix="$PWD/out"
              python ../build/sbom/provenance.py verify --source . --install out \
                --target "macos-$arch" -- "darwin64-${arch}-cc" no-shared no-tests \
                -mmacosx-version-min=10.13 --prefix="$PWD/out"
            )
          done
          for lib in ssl crypto; do
            lipo -create "openssl-src/out/lib/lib${lib}.a" \
              "openssl-x86_64/out/lib/lib${lib}.a" -output "a/lib${lib}.a"
          done
          python build/sbom/provenance.py combine \
            --record openssl-src/out/openssl-build-provenance.json \
            --record openssl-x86_64/out/openssl-build-provenance.json \
            --vendor . --target macos-universal
      - name: Snapshot repository candidate hashes before link
        working-directory: ${{ env.PLUGIN_ROOT }}
        shell: python
        env:
          SOURCE_CANDIDATE: ${{ inputs.native-candidate-plugin-only }}
        run: |
          import hashlib, json, os, shutil, subprocess, sys
          from pathlib import Path
          paths = sorted([*Path("a").rglob("*.a"), *Path("lib/64").rglob("*.lib")])
          Path("native-trace").mkdir(exist_ok=True)
          Path("native-trace/candidates.json").write_text(json.dumps([
              {"path": p.as_posix(), "sha256": hashlib.sha256(p.read_bytes()).hexdigest()}
              for p in paths], indent=2))
          subprocess.run([sys.executable, "build/sbom/generate.py", "sources",
              "--target", "macos-universal" if os.environ["RUNNER_OS"] == "macOS" else "windows-x86_64",
              "--output", "native-trace/embedded-sources.json"], check=True)
          if os.environ["SOURCE_CANDIDATE"] == "true":
              shutil.copyfile("../plugin-candidate-staging.json", "native-trace/plugin-candidate-staging.json")
              for name in ("candidate-inventory-acquisition.json", "candidate-source-acquisition.json"):
                  shutil.copyfile(Path(os.environ["RUNNER_TEMP"]) / name, Path("native-trace") / name)
      - name: Build actual plugin unsigned macOS and capture per-architecture maps
        if: runner.os == 'macOS'
        working-directory: ${{ env.PLUGIN_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project cURL.xcodeproj -target cURL -configuration Default \
            -xcconfig "$PWD/build/sbom/diagnostics.xcconfig" \
            "NATIVE_TRACE_DIRECTORY=$PWD/native-trace" \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO MACOSX_DEPLOYMENT_TARGET=10.13 \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee native-trace/xcodebuild.log
          lipo test/Plugins/cURL.bundle/Contents/MacOS/cURL -verify_arch arm64 x86_64
          for arch in arm64 x86_64; do
            python build/sbom/linker.py --target "macos-$arch" \
              --map "native-trace/cURL-$arch.map" \
              --candidates native-trace/candidates.json \
              --output "native-trace/link-$arch.json"
          done
      - name: Build actual plugin Windows and capture MSVC map and verbose log
        if: runner.os == 'Windows'
        working-directory: ${{ env.PLUGIN_ROOT }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          msbuild cURL.vcxproj /t:Rebuild /p:Configuration=Release /p:Platform=x64 `
            /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 `
            "/p:ForceImportAfterCppTargets=$PWD\build\sbom\diagnostics.props" `
            "/p:NativeTraceDirectory=$PWD\native-trace" /m:1 /nologo /v:normal `
            /fl "/flp:logfile=$PWD\native-trace\msbuild.log;verbosity=normal;encoding=UTF-8"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (!(Test-Path test/Plugins/cURL.bundle/Contents/Windows64/cURL.4DX)) {
            throw 'Missing linked plugin'
          }
          python build/sbom/linker.py --target windows-x86_64 `
            --map native-trace/cURL-x64.map --verbose native-trace/msbuild.log `
            --candidates native-trace/candidates.json --output native-trace/link-x64.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Require actual archive selections and bind unsigned binary hash
        working-directory: ${{ env.PLUGIN_ROOT }}
        shell: python
        run: |
          import hashlib, json, os
          from pathlib import Path
          binary = Path("test/Plugins/cURL.bundle/Contents") / (
              "MacOS/cURL" if os.environ["RUNNER_OS"] == "macOS" else "Windows64/cURL.4DX")
          for candidate in json.loads(Path("native-trace/candidates.json").read_text()):
              if hashlib.sha256(Path(candidate["path"]).read_bytes()).hexdigest() != candidate["sha256"]:
                  raise RuntimeError("Pre-link repository archive changed during build: " + candidate["path"])
          for path in Path("native-trace").glob("link-*.json"):
              evidence = json.loads(path.read_text())
              if not evidence["selectedArchives"]:
                  raise RuntimeError("No archive selections parsed from actual linker output")
              evidence["binarySha256"] = hashlib.sha256(binary.read_bytes()).hexdigest()
              path.write_text(json.dumps(evidence, indent=2) + "\n")
      - name: Collect manifest, source-build and actual linker evidence for SBOM ingestion
        working-directory: ${{ env.PLUGIN_ROOT }}
        shell: python
        env:
          SOURCE_CANDIDATE: ${{ inputs.native-candidate-plugin-only }}
        run: |
          import os, subprocess, sys
          mac = os.environ["RUNNER_OS"] == "macOS"
          command = [
              sys.executable, "build/sbom/generate.py", "inputs",
              "--target", "macos-universal" if mac else "windows-x86_64",
              "--binary", "test/Plugins/cURL.bundle/Contents/" + (
                  "MacOS/cURL" if mac else "Windows64/cURL.4DX"),
              "--manifest", "build/sbom/native-archives.json",
              "--embedded-sources",
              "--embedded-source-snapshot", "native-trace/embedded-sources.json",
              "--brotli-provenance", "brotli-provenance.json",
              "--openssl-provenance", "openssl-provenance.json",
              "--output", "native-trace/build-evidence.json",
          ]
          if mac:
              for arch in ("arm64", "x86_64"):
                  command.extend(["--link-map", f"macos-{arch}=native-trace/cURL-{arch}.map"])
          else:
              command.extend(["--link-map", "windows-x86_64=native-trace/cURL-x64.map",
                              "--link-log", "native-trace/msbuild.log"])
          if os.environ["SOURCE_CANDIDATE"] == "true":
              import json
              from pathlib import Path
              staging = json.loads(Path("../plugin-candidate-staging.json").read_text())
              for kit in staging["nativeSourceKits"]:
                  command.extend(["--native-source-kit", kit])
              for record in staging.get("providerSourceRecords", []):
                  command.extend(["--provider-source-record", record])
          subprocess.run(command, check=True)
      - name: Upload unsigned macOS build and ingestion evidence
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-native-build-macOS
          path: |
            ${{ env.PLUGIN_ROOT }}/test/Plugins/cURL.bundle/
            ${{ env.PLUGIN_ROOT }}/native-trace/build-evidence.json
            ${{ env.PLUGIN_ROOT }}/brotli-provenance.json
            ${{ env.PLUGIN_ROOT }}/openssl-provenance.json
          if-no-files-found: error
      - name: Upload unsigned Windows build and ingestion evidence
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-native-build-Windows
          path: |
            ${{ env.PLUGIN_ROOT }}/test/Plugins/cURL.bundle/Contents/Windows64/cURL.4DX
            ${{ env.PLUGIN_ROOT }}/native-trace/build-evidence.json
            ${{ env.PLUGIN_ROOT }}/brotli-provenance.json
            ${{ env.PLUGIN_ROOT }}/openssl-provenance.json
          if-no-files-found: error
      - name: Replay actual Windows plugin objects with the delivered modified proxy
        if: ${{ inputs.native-candidate-plugin-only && runner.os == 'Windows' }}
        working-directory: ${{ env.PLUGIN_ROOT }}
        shell: python
        run: |
          import json, os, subprocess, sys
          from pathlib import Path
          stage = json.loads(Path("../plugin-candidate-staging.json").read_text())
          proxy = [Path(p) for p in stage["nativeSourceKits"]
                   if (Path(p) / "proxy-build-provenance.json").is_file()]
          if len(proxy) != 1:
              raise RuntimeError("Expected one original Windows proxy source kit")
          subprocess.run([sys.executable, "build/dependencies/relink_plugin_windows.py",
              "--project", str(Path.cwd()), "--output", str(Path(os.environ["RUNNER_TEMP"]) / "plugin-user-relink"),
              "--proxy-candidate", str(proxy[0]),
              "--proxy-relink", str(proxy[0].parent / "isolated-proxy-relink-windows-x86_64")],
              check=True)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && inputs.native-candidate-plugin-only && runner.os == 'Windows' }}
        with:
          name: isolated-full-plugin-relink-Windows
          path: ${{ runner.temp }}/plugin-user-relink/
          if-no-files-found: error
      - name: Export, move and replay delivered Windows source/object materials
        if: ${{ inputs.native-candidate-plugin-only && runner.os == 'Windows' }}
        working-directory: ${{ env.PLUGIN_ROOT }}
        shell: python
        run: |
          import os, shutil, subprocess, sys
          from pathlib import Path
          subprocess.run([sys.executable, "-m", "unittest", "discover", "-s", "build/dependencies"], check=True)
          root = Path(os.environ["RUNNER_TEMP"]) / "portable-plugin"
          root.mkdir()
          initial = root / "initial-kit"
          kit = root / "Moved Windows user kit"
          subprocess.run([sys.executable, "build/dependencies/portable_plugin_windows.py",
              "export", "--project", str(Path.cwd()), "--output", str(initial)], check=True)
          shutil.move(initial, kit)
          tools = kit / "tools/build/dependencies"
          modified = root / "rebuilt-proxy"
          subprocess.run([sys.executable, str(tools / "relink_candidate.py"),
              "--candidate", str(kit / "library-materials/windows-x86_64/libproxy"),
              "--output", str(modified)], check=True)
          source_tools = kit / "product-source/build/dependencies"
          gnu_tools = Path(os.environ["RUNNER_TEMP"]) / "portable-gnu-tools"
          subprocess.run([sys.executable, str(source_tools / "prepare_cygwin.py"),
              "--output", str(gnu_tools)], check=True)
          original_iconv = kit / "library-materials/windows-x86_64/libiconv"
          iconv = root / "rebuilt-iconv"
          subprocess.run([sys.executable, str(source_tools / "build_iconv.py"), "build",
              "--archive", str(original_iconv / "upstream-source.tar.gz"),
              "--output", str(iconv), "--target", "windows-x86_64",
              "--cygwin-root", str(gnu_tools / "root"),
              "--user-candidate", str(original_iconv)], check=True)
          subprocess.run([sys.executable, str(tools / "portable_plugin_windows.py"),
              "replay", "--kit", str(kit), "--output", str(root / "replay"),
              "--modified-proxy", str(modified / "build/libproxy.lib"),
              "--modified-iconv", str(iconv / "install/lib/libiconv.lib")], check=True)
      - name: Stage portable evidence without inaccessible libtool convenience aliases
        if: ${{ always() && inputs.native-candidate-plugin-only && runner.os == 'Windows' }}
        shell: python
        run: |
          import json, os, shutil
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          source = root / "portable-plugin"
          omitted = []
          def aliases(directory, names):
              ignored = [n for n in names
                         if Path(directory).name == ".libs" and n.endswith(".la")]
              omitted.extend((Path(directory) / n).relative_to(source).as_posix() for n in ignored)
              return ignored
          if source.exists():
              destination = root / "portable-plugin-upload"
              shutil.copytree(source, destination, ignore=aliases)
              (destination / "omitted-libtool-aliases.json").write_text(json.dumps({
                  "paths": sorted(omitted),
                  "scope": "Unused GNU convenience aliases only; direct archives, metadata, "
                           "original records and all hashed build files retained."}, indent=2))
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && inputs.native-candidate-plugin-only && runner.os == 'Windows' }}
        with:
          name: isolated-portable-plugin-Windows
          path: ${{ runner.temp }}/portable-plugin-upload/
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: unsigned-native-trace-${{ runner.os }}
          path: ${{ env.PLUGIN_ROOT }}/native-trace/
          if-no-files-found: error

  package-sbom:
    name: Validate unsigned ZIP and DMG native SBOMs
    needs: native
    if: ${{ !cancelled() && needs.native.result == 'success' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r build/sbom/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-native-build-macOS
          path: macos
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-native-build-Windows
          path: windows
      - name: Package unsigned cross-platform test containers without publishing
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE=macos/test/Plugins/cURL.bundle
          mkdir -p "$BUNDLE/Contents/Windows64"
          cp windows/test/Plugins/cURL.bundle/Contents/Windows64/cURL.4DX "$BUNDLE/Contents/Windows64/cURL.4DX"
          # Do not carry the repository's stale signature resources into an unsigned test package.
          rm -f "$BUNDLE/Contents/_CodeSignature/CodeResources"
          VERSION=$(python -c 'import plistlib; print(plistlib.load(open("macos/test/Plugins/cURL.bundle/Contents/Info.plist", "rb"))["CFBundleShortVersionString"])')
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          ditto -c -k --keepParent "$BUNDLE" unsigned-native.zip
          hdiutil create -format UDBZ -volname native-trace -srcfolder "$BUNDLE" unsigned-native.dmg
      - name: Generate and validate all six artifact-bound documents
        shell: bash
        run: |
          set -euo pipefail
          python build/sbom/generate.py generate --version "$RELEASE_VERSION" --output sbom \
            --evidence macos/native-trace/build-evidence.json \
            --evidence windows/native-trace/build-evidence.json \
            unsigned-native.zip unsigned-native.dmg
          python build/sbom/validate.py --version "$RELEASE_VERSION" --output sbom \
            --schema-dir "$RUNNER_TEMP/sbom-schemas" unsigned-native.zip unsigned-native.dmg
      - name: Require complete selected-package and embedded-source coverage
        shell: python
        env:
          SOURCE_CANDIDATE: ${{ inputs.native-candidate-plugin-only }}
        run: |
          import json, os
          from pathlib import Path
          source_candidate = os.environ["SOURCE_CANDIDATE"] == "true"
          manifest = json.loads(Path("build/sbom/native-archives.json").read_text())
          zlib_archive = next(a for a in manifest["archives"] if a["path"] == "lib/64/zlib.lib")
          expected_zlib = zlib_archive["targets"]["windows-x86_64"]["identities"][0]["version"]
          for path in Path("sbom").glob("*.inventory.json"):
              inventory = json.loads(path.read_text())
              for target in inventory["targets"]:
                  coverage = target["selectedArchiveCoverage"]
                  if coverage["uncoveredArchives"] or coverage["namedPackageArchives"] != coverage["selectedRepositoryArchives"]:
                      raise RuntimeError(f"{target['id']}: selected archive/package coverage regressed")
                  expected_selected, expected_versioned = (11, 9) if target["id"].startswith("windows") else (12, 10)
                  if source_candidate:
                      expected_versioned += 1
                  if (coverage["selectedRepositoryArchives"], coverage["versionedPackageArchives"]) != (expected_selected, expected_versioned):
                      raise RuntimeError(f"{target['id']}: actual selected/versioned archive counts changed")
                  print(f"{path.name}: {target['id']}: {coverage}")
                  packages = {p["name"]: p for p in target["dependencies"]}
                  for name in ("Brotli", "OpenSSL"):
                      package = packages[name]
                      if not package.get("selectedArchives") or not package.get("license") or not package.get("purl"):
                          raise RuntimeError(f"{target['id']}: missing usable source identity for {name}")
                  expected = {"libiconv": "1.18" if target["id"].startswith("windows") else "1.16",
                              "nghttp2": "1.70.0"}
                  if target["id"].startswith("macos"):
                      expected["nghttp3"] = "1.15.0"
                  elif "nghttp3" in packages:
                      raise RuntimeError("nghttp3 must not be inferred on Windows")
                  for name, version in expected.items():
                      if packages[name].get("version") != version or not packages[name].get("selectedArchives"):
                          raise RuntimeError(f"{target['id']}: incorrect selected {name} identity")
                  if coverage["unknownVersionPackages"] != (["libmodman"] if source_candidate else ["libmodman", "libproxy"]):
                      raise RuntimeError("Unknown-version selected packages changed; review evidence explicitly")
                  if source_candidate:
                      identities = [a["identity"] for p in packages.values()
                                    for a in p.get("archiveIdentities", [])]
                      if (len(identities) != expected_selected or
                              any(i["evidenceType"] != "source-build-and-selected-archive"
                                  for i in identities)):
                          raise RuntimeError("Candidate plugin has an unexplained selected archive")
                      if packages["libproxy"].get("version") != "0.4.17":
                          raise RuntimeError("Candidate proxy identity changed")
                  expected_sources = {"ftpparse", "4D Plugin SDK"}
                  actual_sources = {p["name"] for p in target["dependencies"]
                                    if p.get("evidenceType") == "build-derived-embedded-source"}
                  if actual_sources != expected_sources:
                      raise RuntimeError(f"{target['id']}: embedded compiled-source coverage changed")
                  if packages["ftpparse"].get("license") != "LicenseRef-ftpparse-public-domain":
                      raise RuntimeError("ftpparse public-domain statement must not be relabeled")
                  source = target["buildEvidence"]["embeddedSourceEvidence"]
                  first_party = {p["name"] for p in source["components"]
                                 if p["scope"] == "first-party-product-source"}
                  if first_party != {"4D plugin C++ wrappers", "4DPlugin-JSON helper", "ufopen UTF-8 path helper"}:
                      raise RuntimeError("First-party product source inventory changed")
                  if first_party.intersection(packages) or any("JsonCpp" in p for p in packages):
                      raise RuntimeError("Product helpers or obsolete JsonCpp promoted to dependencies")
                  sdk = packages["4D Plugin SDK"]
                  if sdk.get("sourceCommit") != "ad7944bc7a13d93db8097c4c8ff55ba2f6e36f86" or not sdk.get("purl"):
                      raise RuntimeError("Missing immutable SDK source identity")
                  if target["id"] == "windows-x86_64":
                      zlib = packages["zlib"]
                      selected = {a["candidatePath"] for a in zlib.get("selectedArchives", [])}
                      if zlib["version"] != expected_zlib or "lib/64/zlib.lib" not in selected or "lib/64/zs.lib" in selected:
                          raise RuntimeError("Windows zlib selection disagrees with the exact-hash manifest")
                      print(f"{path.name}: Windows zlib {zlib['version']} from zlib.lib; zs.lib not promoted")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-native-sboms
          path: sbom/*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-native-containers
          path: |
            unsigned-native.zip
            unsigned-native.dmg
          if-no-files-found: error
